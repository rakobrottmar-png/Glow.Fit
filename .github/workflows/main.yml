name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo prebuild --platform ios
      - name: Archive ohne Signatur
        run: |
          cd ios
          set -o pipefail
          xcodebuild -workspace GlowFit.xcworkspace -scheme GlowFit -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$PWD/build/GlowFit.xcarchive" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee ../build.log || {
            { echo '```'; grep -iE "error|failed|fatal|not found|unable" ../build.log | sort -u | head -30 | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            { echo '```'; tail -40 ../build.log | cut -c1-300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: IPA packen
        run: |
          mkdir Payload
          cp -R ios/build/GlowFit.xcarchive/Products/Applications/GlowFit.app Payload/
          zip -r GlowFit.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: GlowFit-ipa
          path: GlowFit.ipa
